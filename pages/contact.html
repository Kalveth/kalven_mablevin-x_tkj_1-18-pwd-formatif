<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: whitesmoke;
            font-family: Arial, Helvetica, sans-serif;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            padding: 24px;
            border: 1px solid #632323;
            border-radius: 10px;
            justify-self: center;
        }

        .contact-form h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid;
            border-radius: 5px;
        }

        .form-group input:focus, .form-group textarea:focus {
            background-color: rgba(220, 220, 220, 0.811);
            border-color: black;
        }

        .btn-submit {
            background-color: #632323;
            color: white;
            font-weight: bold;
            border: 1px solid;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .btn-submit:hover {
            background-color: #c54040;
        }

        footer {
            text-align: center;
        }
    </style>
</head>
<body>
    <section id="contact">
        <form action="" class="contact-form">
            <h2>Hubungi saya</h2>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea name="message" id="message" rows="5"></textarea>
            </div>
            <button class="btn-submit" type="submit">Kirim Pesan</button>
        </form>
    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
